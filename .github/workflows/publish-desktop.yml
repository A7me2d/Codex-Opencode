name: Publish Coding Room desktop update

on:
  push:
    branches:
      - main
      - new-models

permissions:
  contents: write

concurrency:
  group: coding-room-desktop-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Download Electron runtime
        run: node node_modules/electron/install.js
      - name: Verify Electron runtime was installed
        shell: pwsh
        run: |
          if (-not (Test-Path 'node_modules/electron/dist/electron.exe')) {
            throw 'Electron runtime is missing. Check that electron install scripts are allowed in package.json.'
          }
      - name: Assign a unique release version
        shell: pwsh
        run: npm version "1.0.${{ github.run_number }}" --no-git-tag-version
      - name: Create or verify the release tag
        shell: pwsh
        run: |
          $tag = "v1.0.${{ github.run_number }}"
          $remoteTag = git ls-remote --tags origin "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) {
            throw "Could not check whether release tag $tag exists."
          }

          if ($remoteTag) {
            git fetch origin "refs/tags/${tag}:refs/tags/${tag}"
            if ($LASTEXITCODE -ne 0) {
              throw "Could not fetch existing release tag $tag."
            }
            $tagCommit = git rev-list -n 1 $tag
            if ($tagCommit -ne $env:GITHUB_SHA) {
              throw "Release tag $tag already points to a different commit."
            }
          } else {
            git tag $tag $env:GITHUB_SHA
            if ($LASTEXITCODE -ne 0) {
              throw "Could not create release tag $tag."
            }
            git push origin "refs/tags/$tag"
            if ($LASTEXITCODE -ne 0) {
              throw "Could not push release tag $tag."
            }
          }
      - name: Prepare a single GitHub release for publishing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v1.0.${{ github.run_number }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "User-Agent" = "CodingRoomReleasePublisher"
          }
          $api = "https://api.github.com/repos/A7me2d/Codex-Opencode"
          $releases = Invoke-RestMethod -Headers $headers -Uri "$api/releases?per_page=100"
          $matching = @($releases | Where-Object { $_.tag_name -eq $env:RELEASE_TAG })

          if ($matching.Count -eq 0) {
            $version = $env:RELEASE_TAG -replace '^v', ''
            $body = @{
              tag_name = $env:RELEASE_TAG
              name = $version
              draft = $false
              prerelease = $false
            } | ConvertTo-Json
            $release = Invoke-RestMethod -Method Post -Headers $headers -ContentType 'application/json' -Body $body -Uri "$api/releases"
            Write-Host "Created release $env:RELEASE_TAG ($($release.id)) before parallel asset uploads."
          } else {
            # Keep the release that already has the most artifacts so a workflow
            # rerun preserves any completed uploads, then remove duplicate records.
            $ordered = @($matching | Sort-Object @{ Expression = { $_.assets.Count }; Descending = $true }, @{ Expression = { $_.id }; Descending = $true })
            $release = $ordered[0]
            foreach ($duplicate in @($ordered | Select-Object -Skip 1)) {
              Invoke-RestMethod -Method Delete -Headers $headers -Uri "$api/releases/$($duplicate.id)"
              Write-Host "Removed duplicate release $($duplicate.id); assets will be republished to $($release.id)."
            }
            Write-Host "Using release $($release.id) for $env:RELEASE_TAG."
          }
      - name: Build the application
        run: npm run build
      - name: Publish the Windows installer and update manifest
        run: npx electron-builder --win nsis --x64 --publish always
        env:
          GH_TOKEN: ${{ github.token }}
          EP_GH_IGNORE_TIME: "true"
      - name: Verify the published updater release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v1.0.${{ github.run_number }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "User-Agent" = "CodingRoomReleaseVerifier"
          }
          $releases = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/A7me2d/Codex-Opencode/releases?per_page=100"
          $tagReleases = @($releases | Where-Object { $_.tag_name -eq $env:RELEASE_TAG })
          if ($tagReleases.Count -ne 1) {
            throw "Expected exactly one GitHub Release for $env:RELEASE_TAG, found $($tagReleases.Count)."
          }

          $release = $tagReleases[0]
          $version = $env:RELEASE_TAG -replace '^v', ''
          $requiredAssets = @(
            "Coding-Room-Setup-$version.exe",
            "Coding-Room-Setup-$version.exe.blockmap",
            "latest.yml"
          )
          $assetNames = @($release.assets | ForEach-Object { $_.name })
          $missingAssets = @($requiredAssets | Where-Object { $assetNames -notcontains $_ })
          if ($missingAssets.Count -gt 0) {
            throw "Release $env:RELEASE_TAG is missing updater assets: $($missingAssets -join ', ')."
          }

          $manifestUrl = "https://github.com/A7me2d/Codex-Opencode/releases/download/$env:RELEASE_TAG/latest.yml"
          $manifest = $null
          $downloadError = $null
          for ($attempt = 0; $attempt -lt 6 -and -not $manifest; $attempt++) {
            try {
              $response = Invoke-WebRequest -UseBasicParsing -Uri $manifestUrl -TimeoutSec 30
              if ($response.StatusCode -ne 200) {
                throw "HTTP $($response.StatusCode)"
              }
              if ($response.Content -is [byte[]]) {
                $manifest = [System.Text.Encoding]::UTF8.GetString($response.Content)
              } else {
                $manifest = [string]$response.Content
              }
            } catch {
              $downloadError = $_.Exception.Message
              Start-Sleep -Seconds 5
            }
          }
          if (-not $manifest) {
            throw "The updater manifest URL is not reachable: $manifestUrl ($downloadError)"
          }
          if ($manifest -notmatch "(?m)^version:\s+$([regex]::Escape($version))\s*$" -or $manifest -notmatch [regex]::Escape("Coding-Room-Setup-$version.exe")) {
            throw "The updater manifest does not describe release $env:RELEASE_TAG."
          }
