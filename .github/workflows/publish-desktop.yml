name: Publish Coding Room desktop update

on:
  push:
    branches:
      - main
      - new-models

permissions:
  contents: write

concurrency:
  group: coding-room-desktop-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Download Electron runtime
        run: node node_modules/electron/install.js
      - name: Verify Electron runtime was installed
        shell: pwsh
        run: |
          if (-not (Test-Path 'node_modules/electron/dist/electron.exe')) {
            throw 'Electron runtime is missing. Check that electron install scripts are allowed in package.json.'
          }
      - name: Assign a unique release version
        shell: pwsh
        run: npm version "1.0.${{ github.run_number }}" --no-git-tag-version
      - name: Create or verify the release tag
        shell: pwsh
        run: |
          $tag = "v1.0.${{ github.run_number }}"
          $remoteTag = git ls-remote --tags origin "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) {
            throw "Could not check whether release tag $tag exists."
          }

          if ($remoteTag) {
            git fetch origin "refs/tags/${tag}:refs/tags/${tag}"
            if ($LASTEXITCODE -ne 0) {
              throw "Could not fetch existing release tag $tag."
            }
            $tagCommit = git rev-list -n 1 $tag
            if ($tagCommit -ne $env:GITHUB_SHA) {
              throw "Release tag $tag already points to a different commit."
            }
          } else {
            git tag $tag $env:GITHUB_SHA
            if ($LASTEXITCODE -ne 0) {
              throw "Could not create release tag $tag."
            }
            git push origin "refs/tags/$tag"
            if ($LASTEXITCODE -ne 0) {
              throw "Could not push release tag $tag."
            }
          }
      - name: Build the application
        run: npm run build
      - name: Publish the Windows installer and update manifest
        run: npx electron-builder --win nsis --x64 --publish always
        env:
          GH_TOKEN: ${{ github.token }}
